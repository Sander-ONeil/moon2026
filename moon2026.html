const cos = Math.cos
const sin = Math.sin
const sqrt = Math.sqrt
const acos = Math.acos

class vec3 {
  constructor(x = 0, y = 0, z = 0) {
    this.x = x;
    this.y = y;
    this.z = z;
  }
  subtract(v)
  {
    return new vec3(this.x-v.x, this.y-v.y, this.z-v.z)
  }
  mult(a){
    return new vec3(this.x*a, this.y*a, this.z*a)
  }
  dot(v){
    return this.x*v.x + this.y*v.y + this.z*v.z
  }
  angle_between(v){
    var ratio = this.dot(v)/sqrt(this.dot(this)*v.dot(v))

    return acos(ratio)
  }
}

class quat {
  constructor(r = 1, i = 0, j = 0, k = 0) {
    this.r = r;
    this.i = i;
    this.j = j;
    this.k = k;
  }

  angle_axis(theta = 0, i = 0, j = 0, k = 0) 
  {
    this.r = cos(theta/2.)
    if (typeof i === "number")
    {
        var mult = sin(theta/2) / sqrt(i*i + j*j + k*k)
        this.i = i * mult;
        this.j = j * mult;
        this.k = k * mult;
    }
    if (typeof i === "object")
    {
        var v = i;
        var mult = sin(theta/2) / sqrt(v.x*v.x + v.y*v.y + v.z*v.z)
        this.i = v.x * mult;
        this.j = v.y * mult;
        this.k = v.z * mult;
    }
  }

  rotate(v=new vec3(1,0,0))
  {
    var q = this;
    var x = v.x* (.5-q.j*q.j-q.k*q.k) + v.y * (q.i*q.j - q.k*q.r) + v.z * (q.i*q.k + q.j*q.r);
    var y = v.x * (q.i*q.j + q.k*q.r) + v.y* (.5-q.i*q.i-q.k*q.k) + v.z * (q.j*q.k - q.i*q.r);
    var z = v.x * (q.i*q.k - q.j*q.r) + v.y * (q.j*q.k + q.i*q.r) + v.z* (.5-q.i*q.i-q.j*q.j);
    var newp = new vec3(x*2,y*2,z*2)
    return newp
  }
}

function get_moon_pos_rel_earth(selected_date){
    // this day the moon was futhest from ecliptic and at apogee -spelling
    // this time moon should be at 0deg long
    const October27 = new Date("Wed, 28 Oct 2026 01:20:00 GMT");

    time_since_oct27 = selected_date.valueOf() - October27.valueOf()
    
    // sidereal day 86160000 ms
    days_since = time_since_oct27/(86164000.)

    // Sidereal Month 27.322 days
    months_since = time_since_oct27/(27.322*60*60*1000*24)
    
    //Moon position in orbit***************************

    // could correct speed. about 10% difference max and min speed
    month_angle = months_since * 2. * Math.PI
    moon_v = goal_angle_to_moon(month_angle)



    /// inclination axis debugging step
    inclination_axis = new vec3(0,1,0)
    glup = new quat()
    glup.angle_axis(angleSlider.value,0,0,1)
    inclination_axis = glup.rotate(inclination_axis)
    // end debugging


    // Ecliptic up 5.15 deg
    orbit_to_ecliptic = new quat()

    orbit_to_ecliptic.angle_axis((5.15)*Math.PI/180,inclination_axis)
    moon_v = orbit_to_ecliptic.rotate(moon_v)


    // INTO EARTH SPACE

    /// inclination axis debugging step
    inclination_axis = new vec3(0,1,0)
    glup = new quat()
    glup.angle_axis(angleSlider2.value,0,0,1)
    inclination_axis = glup.rotate(inclination_axis)
    // end debugging

    // Starting with polar tilt 23.44 deg
    earth_tilt = new quat()
    a = -23.44*Math.PI/180
    earth_tilt.angle_axis(a,inclination_axis)

    moon_v = earth_tilt.rotate(moon_v)

    // Day rotation 1 rot/ sidereal day
    a = 2*Math.PI*days_since-0.03572685558413854

    dayrot = new quat()
    dayrot.angle_axis(-a,0,0,1)
    moon_v = dayrot.rotate(moon_v)
    return moon_v
}

function draw_obj(moon_v, color = 'grey')
{
    long = Math.atan2(moon_v.y,moon_v.x)*180/Math.PI
    lat = Math.atan2(moon_v.z,Math.sqrt(moon_v.y*moon_v.y+moon_v.x*moon_v.x))*180/Math.PI
    if (color =='grey'){
        ctx.font = "18px Arial";
    ctx.fillText('Sublunar long lat: ' +  long +','+lat  ,10,220 )}
    
    place = [long/180*canvas.height+canvas.width/2,-lat/180*canvas.height+canvas.height/2]
    console.log('long  ',long*Math.PI/180)
    ctx.beginPath();
    ctx.arc( place[0],place[1], 10, 0, 2 * Math.PI);
    ctx.fillStyle = color
    ctx.fill()
    ctx.stroke()
}
const goal_angle_to_orbital_pos = (goal_angle) => {
    const f1 = new vec3(-783.79 / 2, 0);
    const f2 = new vec3(783.79 / 2, 0);
    let a = 23455;
    let c = Math.abs(f1.x - f2.x) / 2;
    let b = Math.sqrt(a * a - c * c);
    goal_angle += + Math.PI
    let angle = goal_angle;
    let M = goal_angle - 0.0167086 * Math.sin(goal_angle - Math.PI);
    let goal_dif = M - goal_angle;

    for (let n = 0; n < 10; n += 1) {
        angle += goal_dif;
        M = angle - 0.0167086 * Math.sin(angle - Math.PI);
        goal_dif = goal_angle - M;
    }

    p = new vec3(Math.cos(angle) * a, Math.sin(angle) * b);
    return f1.subtract(p);
}

const goal_angle_to_moon = (goal_angle) => {
    distance_between_foci = 405507 - 363300
    const f1 = new vec3(-distance_between_foci / 2, 0);
    const f2 = new vec3(distance_between_foci / 2, 0);
    let a = 384748;
    let c = Math.abs(f1.x - f2.x) / 2;
    let b = Math.sqrt(a * a - c * c);
    goal_angle += + Math.PI
    let angle = goal_angle;
    let M = goal_angle - 0.0549006 * Math.sin(goal_angle - Math.PI);
    let goal_dif = M - goal_angle;

    for (let n = 0; n < 10; n += 1) {
        angle += goal_dif;
        M = angle - 0.0549006 * Math.sin(angle - Math.PI);
        goal_dif = goal_angle - M;
    }

    p = new vec3(Math.cos(angle) * a, Math.sin(angle) * b);
    return f1.subtract(p);
}

function get_sun_pos_rel_earth(selected_date)
{

    const midnight_jan1 = new Date("1 Jan 2026 00:00:00 GMT");
    const time_since_jan1 = selected_date.valueOf() - midnight_jan1.valueOf()

    const years_since_jan1 = time_since_jan1/(60*60*24*365.25*1000)
    const days_since = time_since_jan1/(86164000.)

    // adding 6deg so that periapsis is different than solstice may need to be neg
    yearangle = years_since_jan1 * 2 * Math.PI+6/180*Math.PI

    //location of earth in radius of earth from my old program
    var PP = goal_angle_to_orbital_pos(yearangle)
    // multiply to get km
    sun_v = PP.mult(6371)

    // INTO EARTH SPACE

    // Starting with polar tilt 23.44 deg
    earth_tilt = new quat()
    a = 23.44*Math.PI/180
    earth_tilt.angle_axis(a,0,1,0)

    sun_v = earth_tilt.rotate(sun_v)

    // Day rotation 1 rot/ sidereal day
    // angle so that sun is directly above on solstice
    a = 2*Math.PI*days_since-3.049505513327119
    dayrot = new quat()
    dayrot.angle_axis(-a,0,0,1)
    sun_v = dayrot.rotate(sun_v)
    return sun_v
}

function draw_sun(selected_date){

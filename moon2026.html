<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const rotationMatrix = (axis, angle) => {
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);

    switch (axis) {
        case 0: // X-axis
            return math.matrix([
                [1, 0, 0],
                [0, cosA, sinA],
                [0, -sinA, cosA]
            ]);
        case 1: // Y-axis
            return math.matrix([
                [cosA, 0, -sinA],
                [0, 1, 0],
                [sinA, 0, cosA]
            ]);
        case 2: // Z-axis
            return math.matrix([
                [cosA, sinA, 0],
                [-sinA, cosA, 0],
                [0, 0, 1]
            ]);
        default:
            throw new Error("Invalid axis. Axis should be 0, 1, or 2.");
    }
};

function draw_moon(){
    now = new Date();
    minute = (hourSlider.value - Math.floor(hourSlider.value))*60

    selected_date = new Date(now.getFullYear(), 0, daySlider.value,hourSlider.value,minute);
    thisyear = new Date(2026, 0, 1);

    ctx.fillText('Selected: ' + selected_date.toString(),10,40 )
    ctx.fillStyle = 'red'
    ctx.font = "18px Arial";
    ctx.fillText('UTC: ' + selected_date.getUTCHours()+':'+ selected_date.getUTCMinutes() ,390,40 )
    ctx.fillStyle = 'white'
    ctx.font = "12px Arial";
    const October27 = new Date(2026, 9, 27, 21, 20, 0);
    ctx.fillText('OCT 27: ' + October27.toString(),10,60 )

    time_since_oct27 = selected_date.valueOf() - October27.valueOf()
    ctx.fillText('ms Since OCT 27: ' + time_since_oct27,10,80 )

    days_since = time_since_oct27/(86160000.)
    months_since = time_since_oct27/(27.322*60*60*1000*24)
    ctx.fillText('"Months" Since OCT 27: ' + months_since,10,100 )


    month_angle = months_since * 2. * Math.PI
    ctx.fillText('angle: ' +  month_angle%(2 * Math.PI) ,10,120 )

    distance_between_foci = 405507 - 363300
    x = (405507 + 363300)/2*Math.cos(month_angle) + distance_between_foci/2
    y = 383819*Math.sin(month_angle)

    ctx.fillText('coordinates: ' +  x.toString()+','+y.toString()  ,10,140 )

    moon_orbit_to_ecliptic = (5.15)*Math.PI/180
    z = x*Math.sin(moon_orbit_to_ecliptic)
    x = x*Math.cos(moon_orbit_to_ecliptic)
    
    ctx.fillText('coordinates: ' +  x.toString()+','+y.toString()+','+z.toString()  ,10,160 )

    // rotate moon around z axis by roughly 6 deg 
    // as moon is misaligned with solstice/earth tilt

    moon = [x,y,z]
    // solstice_moon_rotation = rotationMatrix(2,6*Math.PI/180)
    // moon2 = math.multiply(solstice_moon_rotation,moon)
    // a = 6*Math.PI/180
    // moon = [math.cos(a)*x+math.sin(a)*y,math.cos(a)*y-math.sin(a)*x,z]

    ctx.fillText('r1: ' +  moon ,10,180 )
    // rotate moon by 23.44 deg due to tilt
    a = -23.44*Math.PI/180
    x = moon[0]
    y = moon[1]
    z = moon[2]
    moon = [math.cos(a)*x+math.sin(a)*z,y,math.cos(a)*z-math.sin(a)*x]

    // rotate around z axis by < 1 day to align moon at 0 deg longitude
    // on oct 27
    a = 2*Math.PI*days_since
    x = moon[0]
    y = moon[1]
    z = moon[2]
    moon = [math.cos(a)*x+math.sin(a)*y,math.cos(a)*y-math.sin(a)*x,z]

    // rotate by day around y axis
    console.log(moon[0],moon[1])
    long = Math.atan2(moon[1],moon[0])*180/Math.PI
    lat = Math.atan2(moon[2],Math.sqrt(moon[1]*moon[1]+moon[0]*moon[0]))*180/Math.PI
    ctx.fillText('long lat: ' +  long +','+lat  ,10,220 )

    ctx.fill()
    ctx.stroke()

    place = [long/180*canvas.height+canvas.width/2,-lat/180*canvas.height+canvas.height/2]
    console.log(place)

    ctx.beginPath();
    ctx.arc( place[0],place[1], 10, 0, 2 * Math.PI);
    ctx.fillStyle = 'black'
    ctx.fill()
    ctx.beginPath();
    ctx.arc( place[0],place[1], 10, 0, 2 * Math.PI);
    ctx.fillStyle = 'grey'
    ctx.fill()
    ctx.stroke()
}

    // a = 6*Math.PI/180
    // moon = [math.cos(a)*x+math.sin(a)*y,math.cos(a)*y-math.sin(a)*x,z]

    ctx.fillText('r1: ' +  moon ,10,180 )
    // rotate moon by 23.44 deg due to tilt

    long = Math.atan2(moon[1],moon[0])*180/Math.PI
    lat = Math.atan2(moon[2],Math.sqrt(moon[1]*moon[1]+moon[0]*moon[0]))*180/Math.PI
    ctx.fillText('long lat: ' +  long +','+lat  ,10,220 )

    ctx.fill()
    ctx.stroke()

    place = [long/180*canvas.height+canvas.width/2,-lat/180*canvas.height+canvas.height/2]
    console.log(place)

    ctx.beginPath();
    ctx.arc( place[0],place[1], 10, 0, 2 * Math.PI);
    ctx.fillStyle = 'yellow'
    ctx.fill()
    ctx.stroke()
    ctx.fillStyle = 'red'

    ctx.fillText('Month' + days_since  ,10,240 )
}

async function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.font = "12px Arial";

    draw_moon()

}
